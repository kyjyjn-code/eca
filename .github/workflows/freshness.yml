name: Freshness (밀림 감시)

# 데드맨 스위치. LLM 을 전혀 호출하지 않는 순수 스크립트 워크플로라 비용이 0이고,
# monthly.yml 의 키리스 운영(수동 실행) 원칙과 무관하다.
#
# "사람이 잊으면 그 달을 통째로 건너뛴다"를 "잊으면 알림이 온다"로 바꾸는 것이 목적이다.
# 판정 로직은 scripts/check-freshness.js 에 있다 — YAML 안의 로직은 단위 테스트가 불가능하다.
# 이 워크플로는 그 결과를 받아 Issue 를 만들기만 하는 껍데기다.

on:
  schedule:
    - cron: '0 0 20 * *'   # 매월 20일 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 열린 PR·이슈 수집
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --json number,title,updatedAt > /tmp/prs.json
          gh issue list --state open --json title > /tmp/issues.json
          echo "열린 PR: $(jq length /tmp/prs.json)건 / 열린 이슈: $(jq length /tmp/issues.json)건"

      - name: 밀림 판정
        id: check
        run: |
          node scripts/check-freshness.js --prs /tmp/prs.json --issues /tmp/issues.json > /tmp/out.json
          echo "count=$(jq '.이슈필요 | length' /tmp/out.json)" >> "$GITHUB_OUTPUT"
          jq -r '.이슈필요[] | "판정: " + .제목' /tmp/out.json

      - name: 이슈 생성
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.이슈필요[]' /tmp/out.json | while read -r row; do
            제목=$(printf '%s' "$row" | jq -r '.제목')
            본문=$(printf '%s' "$row" | jq -r '.본문')
            echo "이슈 생성: $제목"
            gh issue create --title "$제목" --body "$본문" --label freshness || \
              gh issue create --title "$제목" --body "$본문"
          done

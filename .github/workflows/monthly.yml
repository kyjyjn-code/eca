name: Monthly ECA (월간 자동 수집·게시)

on:
  # 자동(cron) 실행은 사용하지 않는다. 오직 아래 수동 버튼으로만 실행한다.
  # 다시 자동화하려면 아래 두 줄의 주석을 해제한다.
  # schedule:
  #   - cron: '0 0 1 * *'   # 매월 1일 00:00 UTC = 09:00 KST
  workflow_dispatch:      # 수동 실행 버튼 (유일한 실행 경로)
    inputs:
      month:
        description: '대상 월 YYYY-MM (비우면 이번 달)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  monthly-eca:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm ci

      # 리서치 LLM 호출 앞에 두는 가장 싼 게이트. 여기서 깨지면 비싼 단계를 돌지 않는다.
      - name: 테스트
        run: npm test

      - name: 대상 월 결정
        id: month
        run: |
          M="${{ github.event.inputs.month }}"
          if [ -z "$M" ]; then M=$(date -u +%Y-%m); fi
          echo "value=$M" >> "$GITHUB_OUTPUT"
          echo "대상 월: $M"

      - name: Claude Code CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      # --- 0.5단계: 대상 열거 (날짜 연산과 대상 산정을 LLM 에서 제거) ---
      - name: 대상 열거
        env:
          SDC_MONTH: ${{ steps.month.outputs.value }}
        run: node scripts/make-targets.js

      # --- LLM 단계: 리서치 (사실 정보 수집) ---
      - name: 리서치
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SDC_MONTH: ${{ steps.month.outputs.value }}
        run: |
          claude -p "SDC ECA 리서치 에이전트입니다. .claude/agents/researcher.md 를 읽고 그대로 따르세요. 이번 회차에 처리할 대상은 data/raw/${SDC_MONTH}.targets.json 에 전부 열거돼 있습니다 — A(미수록 씨앗)·B(시즌)·C(순회 소스)·D(쿼리)·G(교사 제보)는 신규 발굴, E·F 는 재확인입니다. 신규 발굴은 매월 무조건 수행하며, 전 항목의 처리 결과를 기록하기 전에는 종료할 수 없습니다. 산출물은 data/raw/${SDC_MONTH}.json 과 data/raw/${SDC_MONTH}.coverage.json 둘입니다. 기록 규약은 templates/coverage-template.md 를 따릅니다. 오직 data/raw 에만 쓰세요." \
            --dangerously-skip-permissions

      # --- 1.5단계: 기록 검증 게이트. 기록이 없으면 여기서 멈춘다 ---
      - name: 기록 검증
        id: coverage
        env:
          SDC_MONTH: ${{ steps.month.outputs.value }}
        run: node scripts/check-coverage.js

      # 게이트가 리서치 뒤에 있으므로, 실패하면 비싼 산출물이 러너와 함께 사라진다.
      # 실패했을 때만 data/raw 를 통째로 올려 두어 사람이 보고 고칠 수 있게 한다.
      - name: 리서치 산출물 보존 (검증 실패 시)
        if: failure() && steps.coverage.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ steps.month.outputs.value }}
          path: data/raw/
          retention-days: 14

      # --- LLM 단계: 큐레이션 (판정·가공) ---
      - name: 큐레이션
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SDC_MONTH: ${{ steps.month.outputs.value }}
        run: |
          claude -p "SDC ECA 큐레이터 에이전트입니다. .claude/agents/curator.md 를 읽고 그대로 따르세요. data/raw/${SDC_MONTH}.json 을 읽어 판정 칸을 채워 data/curated/${SDC_MONTH}.json (객체 배열)으로 저장하세요. 웹 접근·git 금지, 오직 data/curated 에만 쓰세요." \
            --dangerously-skip-permissions

      # --- 결정적 스크립트 (병합·링크검증·포스터·엑셀·빌드·계측) ---
      - name: 결정적 파이프라인
        env:
          SDC_MONTH: ${{ steps.month.outputs.value }}
          SDC_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          node scripts/merge.js
          node scripts/check-links.js
          node scripts/fetch-posters.js
          node scripts/export-excel.js
          node scripts/build.js
          node scripts/compute-kpi.js

      - name: PR 변경 요약 생성
        env:
          SDC_MONTH: ${{ steps.month.outputs.value }}
        run: node scripts/pr-summary.js > pr-body.md

      # --- 가드레일: CLAUDE.md 0장 절대 원칙을 게시 산출물에서 확인. 걸리면 여기서 멈춘다 ---
      - name: 가드레일 검사
        run: node scripts/check-guardrails.js

      # --- 안전장치: 게시 건수 확인. 기준(10건) 미만이면 PR을 초안(Draft)으로 만들어 실수 머지 방지 ---
      - name: 게시 건수 게이트
        id: gate
        run: |
          CNT=$(node -e "const fs=require('fs'); let d=[]; try{ d=JSON.parse(fs.readFileSync('docs/data.json','utf8')); }catch(e){}; process.stdout.write(String(d.length))")
          echo "count=$CNT" >> "$GITHUB_OUTPUT"
          if [ "$CNT" -lt 10 ]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ 게시 $CNT 건 — 기준(10건) 미만이라 PR을 초안(Draft)으로 만듭니다."
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "게시 $CNT 건 — 정상."
          fi

      # --- 게시용 PR (라이브 직접 배포 아님. 사람이 승인·머지해야 반영) ---
      - name: 게시용 PR 생성
        uses: peter-evans/create-pull-request@v6
        with:
          branch: eca/update-${{ steps.month.outputs.value }}
          title: "ECA 월간 업데이트 — ${{ steps.month.outputs.value }} (게시 ${{ steps.gate.outputs.count }}건)"
          body-path: pr-body.md
          commit-message: "chore(eca): ${{ steps.month.outputs.value }} 월간 업데이트"
          draft: ${{ steps.gate.outputs.draft }}
          add-paths: |
            data/master.json
            data/raw
            data/curated
            data/reports
            data/retro
            data/review
            templates
            docs
            records
